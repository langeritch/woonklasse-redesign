<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder — hier komt eigen content">
  <defs>
    <pattern id="wkPlaceholderStripes" width="112" height="112" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="112" height="112" fill="#ff008a"/>
      <rect width="56" height="112" fill="#1b1f22"/>
    </pattern>
  </defs>

  <!-- bold diagonal magenta/anthracite stripes: unmistakably NOT real content -->
  <rect width="1600" height="1000" fill="url(#wkPlaceholderStripes)"/>

  <!-- centre plate so the text stays legible over the stripes -->
  <rect x="120" y="330" width="1360" height="340" rx="18" fill="#ffffff"/>
  <rect x="120" y="330" width="1360" height="340" rx="18" fill="none" stroke="#ff008a" stroke-width="10"/>

  <g font-family="'Advent Pro', 'Arial Narrow', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="530" font-size="150" font-weight="700" letter-spacing="14" fill="#1b1f22">PLACEHOLDER</text>
    <text x="800" y="610" font-size="52" font-weight="500" letter-spacing="4" fill="#ff008a">Hier komt eigen content</text>
  </g>
</svg>
