<style>
:root {
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --line: #e6e2dc;
  --cream: #faf7f1;
  --taupe: #ada89e;
  --gold: #2a2e33;
  --bg: #fff;
  --display: "Advent Pro", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.editor-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 20px 28px;
}
.editor-header__inner {
  max-width: 1480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.editor-header__title {
  font-family: var(--display);
  font-weight: 500;
  font-size: 18px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin: 0;
  color: var(--ink);
}
.editor-header__title span { color: var(--muted); font-weight: 400; letter-spacing: 0.05em; margin-left: 8px; font-size: 13px; }
.editor-header__actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn {
  font-family: var(--display);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 18px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  transition: background-color .2s, color .2s;
}
.btn:hover { background: var(--gold); border-color: var(--gold); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: #fff; }
.btn--danger { border-color: #c9543a; color: #c9543a; background: transparent; }
.btn--danger:hover { background: #c9543a; color: #fff; }

/* Progress bar */
.progress-wrap {
  max-width: 1480px;
  margin: 0 auto;
  padding: 12px 28px 0;
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.progress-bar {
  flex: 1;
  height: 3px;
  background: var(--line);
  overflow: hidden;
}
.progress-bar__fill {
  height: 100%;
  background: var(--gold);
  width: 0;
  transition: width .25s ease;
}

/* Layout */
.editor-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  max-width: 1480px;
  margin: 0 auto;
  gap: 40px;
  padding: 32px 28px 80px;
  align-items: start;
}

/* Sidebar */
.sidebar {
  position: sticky;
  top: 130px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  padding-right: 8px;
}
.sidebar h2 {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 22px 0 8px;
  font-weight: 500;
}
.sidebar h2:first-child { margin-top: 0; }
.sidebar a {
  display: block;
  padding: 8px 14px;
  font-family: var(--body);
  font-size: 13.5px;
  color: var(--ink);
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: background-color .15s, border-color .15s, color .15s;
  position: relative;
}
.sidebar a:hover { background: var(--cream); border-left-color: var(--line); }
.sidebar a.active { background: var(--cream); border-left-color: var(--gold); font-weight: 500; }
.sidebar a .count {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--display);
  letter-spacing: 0.08em;
  margin-left: 8px;
  background: var(--line);
  padding: 1px 6px;
  border-radius: 999px;
}
.sidebar a.has-changes .count { background: var(--gold); color: #fff; }

/* Filter input */
.filter-box {
  margin-bottom: 16px;
  position: relative;
}
.filter-box input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  background: #fff;
  font-family: var(--body);
  font-size: 13.5px;
  color: var(--ink);
}
.filter-box input:focus { outline: none; border-color: var(--ink); }

/* Main content */
.main {
  min-width: 0;
}
.section {
  background: #fff;
  border: 1px solid var(--line);
  padding: 32px 36px;
  margin-bottom: 24px;
  scroll-margin-top: 140px;
}
.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.section__title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  color: var(--ink);
}
.section__page {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--cream);
  padding: 4px 10px;
}

/* Field */
.field {
  margin-bottom: 22px;
  position: relative;
}
.field.is-changed::before {
  content: "";
  position: absolute;
  left: -36px;
  top: 6px;
  bottom: 6px;
  width: 3px;
  background: var(--gold);
}
.field__label {
  display: block;
  font-family: var(--display);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
.field__current {
  font-family: var(--body);
  font-size: 14px;
  color: var(--muted);
  background: var(--cream);
  border-left: 2px solid var(--line);
  padding: 8px 12px;
  margin-bottom: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}
.field__current::before {
  content: "Huidig: ";
  font-family: var(--display);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10.5px;
  color: var(--muted);
  margin-right: 4px;
  font-weight: 500;
}
.field input,
.field textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  font-family: var(--body);
  font-size: 14.5px;
  color: var(--ink);
  padding: 10px 14px;
  transition: border-color .2s;
  resize: vertical;
}
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--ink);
}
.field textarea { min-height: 72px; }
.field.is-changed input,
.field.is-changed textarea {
  border-color: var(--gold);
  background: #f5f7fa;
}
.field__hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* Section intro/note */
.section__note {
  font-size: 13.5px;
  color: var(--muted);
  background: var(--cream);
  border-left: 2px solid var(--gold);
  padding: 10px 14px;
  margin-bottom: 20px;
  line-height: 1.55;
}

/* Status bar */
.status {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--ink);
  color: #fff;
  padding: 10px 16px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .25s, transform .25s;
  z-index: 100;
  pointer-events: none;
}
.status.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 900px) {
  .editor-layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; }
  .section { padding: 24px 20px; }
}
</style>
</head>

// =========================================================================
// STATE & STORAGE
// =========================================================================
const STORAGE_KEY = 'woonklasse-content-editor-v1';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

const saveState = () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  flashStatus('opgeslagen');
};

const allFields = CONTENT.flatMap(s => s.fields.map(f => ({...f, sectionId: s.id})));
const totalFields = allFields.length;

// =========================================================================
// RENDER
// =========================================================================
const main = document.getElementById('main');
const sidebar = document.getElementById('sidebar');

const countChangesInSection = (sectionId) => {
  const sec = CONTENT.find(s => s.id === sectionId);
  if (!sec) return 0;
  return sec.fields.filter(f => state[f.id] && state[f.id].trim()).length;
};

const renderSidebar = () => {
  // Group by page
  const pages = {};
  CONTENT.forEach(s => {
    if (!pages[s.page]) pages[s.page] = [];
    pages[s.page].push(s);
  });

  let html = '<div class="filter-box"><input type="text" id="filterInput" placeholder="Zoek in alle velden..."/></div>';
  Object.entries(pages).forEach(([page, sections]) => {
    html += `<h2>${escapeHtml(page)}</h2>`;
    sections.forEach(s => {
      const changeCount = countChangesInSection(s.id);
      const total = s.fields.length;
      html += `<a href="#${s.id}" data-section="${s.id}" class="${changeCount > 0 ? 'has-changes' : ''}">${escapeHtml(s.title)} <span class="count">${changeCount}/${total}</span></a>`;
    });
  });
  sidebar.innerHTML = html;

  // Filter input event
  const filter = document.getElementById('filterInput');
  if (filter) filter.addEventListener('input', applyFilter);
};

const renderMain = () => {
  let html = '';
  CONTENT.forEach(sec => {
    html += `<section class="section" id="${sec.id}">
      <div class="section__head">
        <h2 class="section__title">${escapeHtml(sec.title)}</h2>
        <span class="section__page">${escapeHtml(sec.page)}</span>
      </div>`;
    if (sec.note) html += `<div class="section__note">${escapeHtml(sec.note)}</div>`;

    sec.fields.forEach(f => {
      const v = state[f.id] || '';
      const isChanged = v.trim().length > 0;
      const isMulti = f.multiline || (f.current && f.current.length > 80) || (f.current && f.current.includes('\n'));
      const inputEl = isMulti
        ? `<textarea data-id="${f.id}" placeholder="${escapeAttr(f.hint || 'Type hier de nieuwe tekst...')}">${escapeHtml(v)}</textarea>`
        : `<input type="text" data-id="${f.id}" value="${escapeAttr(v)}" placeholder="${escapeAttr(f.hint || 'Type hier de nieuwe tekst...')}"/>`;
      html += `
        <div class="field ${isChanged ? 'is-changed' : ''}" data-field="${f.id}">
          <label class="field__label">${escapeHtml(f.label)}</label>
          <div class="field__current">${escapeHtml(f.current)}</div>
          ${inputEl}
          ${f.hint ? `<p class="field__hint">${escapeHtml(f.hint)}</p>` : ''}
        </div>`;
    });
    html += `</section>`;
  });
  main.innerHTML = html;

  // Bind input events
  main.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('input', () => {
      const id = el.dataset.id;
      const val = el.value;
      if (val.trim()) state[id] = val;
      else delete state[id];
      el.closest('.field').classList.toggle('is-changed', val.trim().length > 0);
      saveState();
      updateProgress();
      renderSidebar();
    });
  });
};

const updateProgress = () => {
  const changed = Object.values(state).filter(v => v && v.trim()).length;
  document.getElementById('progressLabel').textContent = `${changed} / ${totalFields} velden gewijzigd`;
  document.getElementById('progressFill').style.width = `${(changed / totalFields) * 100}%`;
};

// Active section tracking
const observeSections = () => {
  const opts = { rootMargin: '-140px 0px -60% 0px', threshold: 0 };
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        const link = document.querySelector(`.sidebar a[data-section="${e.target.id}"]`);
        if (link) link.classList.add('active');
      }
    });
  }, opts);
  document.querySelectorAll('.section').forEach(s => obs.observe(s));
};

// Filter
const applyFilter = (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.section').forEach(sec => {
    let anyVisible = false;
    sec.querySelectorAll('.field').forEach(field => {
      const text = field.textContent.toLowerCase();
      const match = !q || text.includes(q);
      field.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    sec.style.display = anyVisible ? '' : 'none';
  });
};

// =========================================================================
// EXPORT
// =========================================================================
const exportChanges = () => {
  const changes = [];
  CONTENT.forEach(sec => {
    const sectionChanges = sec.fields
      .filter(f => state[f.id] && state[f.id].trim())
      .map(f => ({
        id: f.id,
        label: f.label,
        current: f.current,
        new: state[f.id].trim()
      }));
    if (sectionChanges.length) {
      changes.push({
        section: sec.title,
        page: sec.page,
        fields: sectionChanges
      });
    }
  });

  if (changes.length === 0) {
    alert('Nog geen wijzigingen om te exporteren.');
    return;
  }

  // Build markdown
  const ts = new Date().toLocaleString('nl-NL');
  let md = `# Woonklasse — Content wijzigingen\n*Gegenereerd: ${ts}*\n\n`;
  changes.forEach(sec => {
    md += `\n## ${sec.section}  \n*${sec.page}*\n\n`;
    sec.fields.forEach(f => {
      md += `### ${f.label}  \n\`${f.id}\`\n\n`;
      md += `**Huidig:** ${f.current}\n\n`;
      md += `**Nieuw:** ${f.new}\n\n`;
      md += `---\n\n`;
    });
  });

  // Build JSON
  const jsonObj = {};
  changes.forEach(sec => sec.fields.forEach(f => { jsonObj[f.id] = f.new; }));

  // Download both
  download('woonklasse-content-changes.md', md, 'text/markdown');
  download('woonklasse-content-changes.json', JSON.stringify(jsonObj, null, 2), 'application/json');
  flashStatus('geëxporteerd');
};

const download = (filename, content, mime) => {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// =========================================================================
// UTILS
// =========================================================================
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const escapeAttr = (s) => escapeHtml(s);

let statusTimer;
const flashStatus = (msg) => {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.classList.remove('show'), 1500);
};

// =========================================================================
// BOOT
// =========================================================================
renderSidebar();
renderMain();
updateProgress();
observeSections();

document.getElementById('exportBtn').addEventListener('click', exportChanges);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Weet je zeker dat je alle wijzigingen wil verwijderen? Dit kan niet ongedaan worden gemaakt.')) {
    state = {};
    saveState();
    renderSidebar();
    renderMain();
    updateProgress();
    flashStatus('reset');
  }
});

document.getElementById('filterToggle').addEventListener('click', () => {
  const box = document.querySelector('.filter-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') box.querySelector('input').focus();
});

// Smooth scroll on sidebar clicks
sidebar.addEventListener('click', (e) => {
  const link = e.target.closest('a[data-section]');
  if (link) {
    e.preventDefault();
    document.getElementById(link.dataset.section).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
</script>
